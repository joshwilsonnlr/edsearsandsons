<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Ed Sears &amp; Son</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--bg2:#121216;--card:#1a1a20;--accent:#e8a838;--accent2:#c48a2a;--text:#f2f2f6;--muted:#9a9aaa;--border:rgba(255,255,255,.08);--radius:14px;--font:'Inter',system-ui,sans-serif;--display:'Oswald',system-ui,sans-serif;--header:70px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
.container{width:min(1200px,92%);margin-inline:auto}
.site-header{position:sticky;top:0;z-index:1000;height:var(--header);background:rgba(10,10,12,.95);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:100%;width:min(1200px,92%);margin-inline:auto}
.logo-text{font-family:var(--display);font-weight:700;font-size:1.1rem}.logo-text span{color:var(--accent)}.logo-sub{font-size:.6rem;letter-spacing:.22em;color:var(--muted);display:block}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}.nav-links a{padding:8px 12px;font-size:.85rem;color:var(--muted);border-radius:8px}
.nav-links a.active,.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-cta{background:linear-gradient(135deg,var(--accent),var(--accent2))!important;color:#0a0a0c!important;font-weight:600!important;padding:10px 16px!important;border-radius:50px!important}
.nav-toggle{display:none;background:none;color:var(--text);font-size:1.5rem;border:none;cursor:pointer}
.page-hero{background:var(--bg2);padding:48px 0;text-align:center;border-bottom:1px solid var(--border)}
.page-hero h1{font-family:var(--display);font-size:2.2rem;margin-bottom:8px}.page-hero p{color:var(--muted)}
.section{padding:72px 0}
.contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:36px}
.contact-block{margin-bottom:24px}.contact-block h3{color:var(--accent);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.phone-big{font-family:var(--display);font-size:1.5rem;color:var(--accent)}
.btn{display:inline-flex;padding:14px 26px;font-weight:600;border-radius:50px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0a0c}
.map-frame{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);min-height:340px}
.map-frame iframe{width:100%;height:340px;border:0}
.site-footer{border-top:1px solid var(--border);padding:32px 0;margin-top:40px;text-align:center;color:var(--muted);font-size:.9rem}
@media(max-width:900px){.nav-toggle{display:block}.nav-links{display:none;position:absolute;top:70px;left:0;right:0;background:#0a0a0c;flex-direction:column;padding:16px}.nav-links.open{display:flex}.contact-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><nav class="nav">
<a href="../index.html" class="logo"><span class="logo-text">ED SEARS <span>&amp; SON</span></span><span class="logo-sub">AUTO REPAIR</span></a>
<button type="button" class="nav-toggle">☰</button>
<div class="nav-links">
<a href="../index.html">Home</a><a href="../services/index.html">Services</a><a href="../vehicles/index.html">Vehicles</a>
<a href="../reviews/index.html">Reviews</a><a href="index.html" class="active">Contact</a>
<a href="https://edsearsandsons.com/appointments/" class="nav-cta" target="_blank" rel="noopener">Schedule</a>
</div></nav></header>
<div class="page-hero"><div class="container"><h1>Contact Us</h1><p>Ballston Spa, NY</p></div></div>
<section class="section"><div class="container"><div class="contact-grid">
<div>
<div class="contact-block"><h3>Address</h3><p>1241 Saratoga Rd<br>Ballston Spa, NY 12020</p></div>
<div class="contact-block"><h3>Phone</h3><a class="phone-big" href="tel:+15183094157">(518) 309-4157</a></div>
<div class="contact-block"><h3>Hours</h3><p style="color:var(--muted)">Mon–Fri 8:30 AM – 5:00 PM<br>Sat–Sun Closed</p></div>
<a href="https://edsearsandsons.com/appointments/" class="btn" target="_blank" rel="noopener">Schedule Appointment</a>
</div>
<div class="map-frame"><iframe src="https://maps.google.com/maps?q=1241+Saratoga+Rd+Ballston+Spa+NY+12020&output=embed" loading="lazy" title="Map"></iframe></div>
</div></div></section>
<footer class="site-footer"><p>&copy; <span id="year"></span> Ed Sears &amp; Son Auto Repair</p></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();var t=document.querySelector('.nav-toggle'),l=document.querySelector('.nav-links');if(t&&l)t.onclick=function(){l.classList.toggle('open')};</script>
</body></html>
